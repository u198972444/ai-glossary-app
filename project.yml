# XcodeGen 項目配置
name: AIGlossaryApp
options:
  bundleIdPrefix: com.caioacademy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    UI_USER_INTERFACE_STYLE: Light
    INFOPLIST_KEY_UIApplicationSceneManifest_UIApplicationSupportsMultipleScenes: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: AI 單詞鎖屏
    DEVELOPMENT_TEAM: "26RPYPPKBF"

targets:
  AIGlossaryApp:
    type: application
    platform: iOS
    sources:
      - path: AIGlossaryApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caioacademy.aiword
        INFOPLIST_FILE: AIGlossaryApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIGlossaryApp/AIGlossaryApp.entitlements
        DEVELOPMENT_TEAM: 26RPYPPKBF
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: 2D908B2A8FCDE7E0BA8CD1A5883A0D3DB9D66C38
          PROVISIONING_PROFILE_SPECIFIER: APP_PROFILE_UUID_PLACEHOLDER
    dependencies:
      - target: AIGlossaryWidget
        embed: true
      - sdk: StoreKit.framework

  AIGlossaryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AIGlossaryWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caioacademy.aiword.widget
        INFOPLIST_FILE: AIGlossaryWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIGlossaryWidget/AIGlossaryWidget.entitlements
        DEVELOPMENT_TEAM: 26RPYPPKBF
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: 2D908B2A8FCDE7E0BA8CD1A5883A0D3DB9D66C38
          PROVISIONING_PROFILE_SPECIFIER: WIDGET_PROFILE_UUID_PLACEHOLDER

schemes:
  AIGlossaryApp:
    build:
      targets:
        AIGlossaryApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# XcodeGen 項目配置
# 使用方式：安裝 XcodeGen (brew install xcodegen)，然後在項目目錄執行 `xcodegen generate`
# 這會自動生成 AIGlossaryApp.xcodeproj

name: AIGlossaryApp
options:
  bundleIdPrefix: com.caioacademy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    UI_USER_INTERFACE_STYLE: Light
    INFOPLIST_KEY_UIApplicationSceneManifest_UIApplicationSupportsMultipleScenes: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: AI 單詞鎖屏
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "26RPYPPKBF"

targets:
  # MARK: - 主 App
  AIGlossaryApp:
    type: application
    platform: iOS
    sources:
      - path: AIGlossaryApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caioacademy.aiword
        INFOPLIST_FILE: AIGlossaryApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIGlossaryApp/AIGlossaryApp.entitlements
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: 26RPYPPKBF
    dependencies:
      - target: AIGlossaryWidget
        embed: true
      - sdk: StoreKit.framework

  # MARK: - Widget Extension
  AIGlossaryWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AIGlossaryWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caioacademy.aiword.widget
        INFOPLIST_FILE: AIGlossaryWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIGlossaryWidget/AIGlossaryWidget.entitlements
        CODE_SIGN_IDENTITY: Apple Distribution
        DEVELOPMENT_TEAM: 26RPYPPKBF
        SKIP_INSTALL: YES

# MARK: - Schemes
schemes:
  AIGlossaryApp:
    build:
      targets:
        AIGlossaryApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

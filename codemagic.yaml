workflows:
  ai-glossary-ios:
    name: AI 單詞鎖屏 iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "AIGlossaryApp.xcodeproj"
        XCODE_SCHEME: "AIGlossaryApp"
        BUNDLE_ID: "com.caioacademy.aiword"
        APP_STORE_APP_ID: "6811531436"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "564KFGA7UP"
        APP_STORE_CONNECT_ISSUER_ID: "ab325cbd-b559-4d0b-8d54-0d88046b27e5"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgecPv6rJ8lAvcza7c
          jCHANWlVnbyFEQKvodnTQDD48tqgCgYIKoZIzj0DAQehRANCAAR2F4loZwA4KQGd
          N8MvRIxjADcbYS0Q/rsKjuVfTdlg6NRcvkQZIvdm67ncBhJJzn1pwdJoC3ye+5Mo
          xDjNDS4X
          -----END PRIVATE KEY-----
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.caioacademy.aiword
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd AIGlossaryApp
          xcodegen generate
      - name: Set up code signing settings on Xcode project
        script: |
          cd AIGlossaryApp
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Increment build number
        script: |
          cd AIGlossaryApp
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID") + 1))
        ignore_failure: true
      - name: Build IPA
        script: |
          cd AIGlossaryApp
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Upload to App Store Connect
        script: |
          cd AIGlossaryApp
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          xcrun altool --upload-app \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

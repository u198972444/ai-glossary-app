workflows:
  ai-glossary-ios:
    name: AI Word Lock Screen iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.caioacademy.aiword
      vars:
        XCODE_PROJECT: "AIGlossaryApp.xcodeproj"
        XCODE_SCHEME: "AIGlossaryApp"
        BUNDLE_ID: "com.caioacademy.aiword"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "564KFGA7UP"
        APP_STORE_CONNECT_ISSUER_ID: "ab325cbd-b559-4d0b-8d54-0d88046b27e5"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CODE_SIGNING_STYLE=MANUAL"
      - name: Upload to App Store Connect
        script: |
          echo "Setting up App Store Connect key..."
          mkdir -p ~/.appstoreconnect/private_keys
          
          KEY_ID="$APP_STORE_CONNECT_KEY_IDENTIFIER"
          ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          
          echo "Using Key ID: $KEY_ID"
          echo "Using Issuer ID: $ISSUER_ID"
          
          cp AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "Private key installed"
          
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA found: $IPA_PATH"
          
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          
          echo "Upload successful!"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

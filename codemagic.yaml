workflows:
  ai-glossary-ios:
    name: AI Word Lock Screen iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "AIGlossaryApp.xcodeproj"
        XCODE_SCHEME: "AIGlossaryApp"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "564KFGA7UP"
        APP_STORE_CONNECT_ISSUER_ID: "ab325cbd-b559-4d0b-8d54-0d88046b27e5"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Import code signing
        script: |
          # 创建 keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # 导入证书
          security import signing/aiword_distribution.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          # 解码配置文件获取 UUID
          APP_PROFILE_UUID=$(security cms -D -i signing/AIWord_AppStore.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - -)
          WIDGET_PROFILE_UUID=$(security cms -D -i signing/AIWord_Widget_AppStore.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - -)
          APP_PROFILE_NAME=$(security cms -D -i signing/AIWord_AppStore.mobileprovision 2>/dev/null | plutil -extract Name raw -o - -)
          WIDGET_PROFILE_NAME=$(security cms -D -i signing/AIWord_Widget_AppStore.mobileprovision 2>/dev/null | plutil -extract Name raw -o - -)
          echo "App Profile: $APP_PROFILE_NAME (UUID: $APP_PROFILE_UUID)"
          echo "Widget Profile: $WIDGET_PROFILE_NAME (UUID: $WIDGET_PROFILE_UUID)"
          # 安装配置文件（用 UUID 命名）
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp signing/AIWord_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID}.mobileprovision"
          cp signing/AIWord_Widget_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${WIDGET_PROFILE_UUID}.mobileprovision"
          # 导出环境变量
          echo "export APP_PROFILE_UUID=$APP_PROFILE_UUID" >> /tmp/profile_env.sh
          echo "export WIDGET_PROFILE_UUID=$WIDGET_PROFILE_UUID" >> /tmp/profile_env.sh
          # 验证证书
          security find-identity -v -p codesigning build.keychain
      - name: Build Archive
        script: |
          source /tmp/profile_env.sh
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AIGlossaryApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER_APP="$APP_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER_WIDGET="$WIDGET_PROFILE_UUID" \
            archive 2>&1 | tee build_archive.log | tail -80
      - name: Export IPA
        script: |
          source /tmp/profile_env.sh
          cat > export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store</string>
              <key>signingStyle</key><string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.caioacademy.aiword</key><string>$APP_PROFILE_UUID</string>
                  <key>com.caioacademy.aiword.widget</key><string>$WIDGET_PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/AIGlossaryApp.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export_options.plist 2>&1 | tee export_ipa.log | tail -80
      - name: Upload to App Store Connect
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Upload successful!"
    artifacts:
      - build/ios/ipa/*.ipa
      - build_archive.log
      - export_ipa.log

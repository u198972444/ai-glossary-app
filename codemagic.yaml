workflows:
  ai-glossary-ios:
    name: AI Word Lock Screen iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "AIGlossaryApp.xcodeproj"
        XCODE_SCHEME: "AIGlossaryApp"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "564KFGA7UP"
        APP_STORE_CONNECT_ISSUER_ID: "ab325cbd-b559-4d0b-8d54-0d88046b27e5"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
      - name: Set up keychain and import certificate
        script: |
          # 创建 keychain
          keychain initialize
          # 导入证书
          keychain add-certificates --certificate signing/aiword_distribution.p12 --certificate-password ""
          # 列出证书
          security find-identity -v -p codesigning
      - name: Install profiles
        script: |
          # 安装配置文件
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp signing/AIWord_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          cp signing/AIWord_Widget_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          # 列出配置文件
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
          # 解码配置文件
          echo "=== App Profile ==="
          security cms -D -i signing/AIWord_AppStore.mobileprovision 2>/dev/null | plutil -p - | grep -E "Name|UUID|TeamIdentifier|Entitlements" | head -20
          echo "=== Widget Profile ==="
          security cms -D -i signing/AIWord_Widget_AppStore.mobileprovision 2>/dev/null | plutil -p - | grep -E "Name|UUID|TeamIdentifier|Entitlements" | head -20
      - name: Build IPA with xcode-project
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CODE_SIGN_STYLE=Manual" 2>&1 | tee build_ipa.log | tail -100
      - name: Upload to App Store Connect
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Upload successful!"
    artifacts:
      - build/ios/ipa/*.ipa
      - build_ipa.log
      - /tmp/xcodebuild_logs/*.log

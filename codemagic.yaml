workflows:
  ai-glossary-ios:
    name: AI Word Lock Screen iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "AIGlossaryApp.xcodeproj"
        XCODE_SCHEME: "AIGlossaryApp"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "564KFGA7UP"
        APP_STORE_CONNECT_ISSUER_ID: "ab325cbd-b559-4d0b-8d54-0d88046b27e5"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Set up API key
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
      - name: Import certificate
        script: |
          keychain initialize
          keychain add-certificates --certificate signing/ios_distribution_pwd.p12 --certificate-password "codemagic123"
      - name: Install profiles and generate project
        script: |
          APP_UUID=$(security cms -D -i signing/AIWord_AppStore.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - -)
          WIDGET_UUID=$(security cms -D -i signing/AIWord_Widget_AppStore.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - -)
          echo "App UUID: $APP_UUID"
          echo "Widget UUID: $WIDGET_UUID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp signing/AIWord_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_UUID}.mobileprovision"
          cp signing/AIWord_Widget_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${WIDGET_UUID}.mobileprovision"
          sed -i '' "s/APP_PROFILE_UUID_PLACEHOLDER/$APP_UUID/g" project.yml
          sed -i '' "s/WIDGET_PROFILE_UUID_PLACEHOLDER/$WIDGET_UUID/g" project.yml
          xcodegen generate
          # 保存 UUID 供后续步骤使用
          echo "APP_UUID=$APP_UUID" > /tmp/profile_uuids.sh
          echo "WIDGET_UUID=$WIDGET_UUID" >> /tmp/profile_uuids.sh
      - name: Build Archive
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AIGlossaryApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 | tee build_archive.log | tail -50
      - name: Export IPA
        script: |
          source /tmp/profile_uuids.sh
          cat > export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store</string>
              <key>signingStyle</key><string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.caioacademy.aiword</key><string>$APP_UUID</string>
                  <key>com.caioacademy.aiword.widget</key><string>$WIDGET_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF
          cat export_options.plist
          xcodebuild -exportArchive \
            -archivePath build/AIGlossaryApp.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export_options.plist 2>&1 | tee export_ipa.log | tail -50
      - name: Upload to App Store Connect
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Upload successful!"
    artifacts:
      - build/ios/ipa/*.ipa
      - build_archive.log
      - export_ipa.log
      - debug.log

workflows:
  ai-glossary-ios:
    name: AI Word Lock Screen iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "AIGlossaryApp.xcodeproj"
        XCODE_SCHEME: "AIGlossaryApp"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "564KFGA7UP"
        APP_STORE_CONNECT_ISSUER_ID: "ab325cbd-b559-4d0b-8d54-0d88046b27e5"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Set up code signing
        script: |
          # 创建 keychain
          keychain initialize
          # 导入证书
          keychain add-certificates --certificate signing/aiword_distribution.p12 --certificate-password ""
          # 解码配置文件获取 UUID
          APP_UUID=$(security cms -D -i signing/AIWord_AppStore.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - -)
          WIDGET_UUID=$(security cms -D -i signing/AIWord_Widget_AppStore.mobileprovision 2>/dev/null | plutil -extract UUID raw -o - -)
          echo "App UUID: $APP_UUID"
          echo "Widget UUID: $WIDGET_UUID"
          # 安装配置文件（用 UUID 命名）
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp signing/AIWord_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_UUID}.mobileprovision"
          cp signing/AIWord_Widget_AppStore.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${WIDGET_UUID}.mobileprovision"
          # 替换 project.yml 中的占位符（在 xcodegen 之前）
          sed -i '' "s/APP_PROFILE_UUID_PLACEHOLDER/$APP_UUID/g" project.yml
          sed -i '' "s/WIDGET_PROFILE_UUID_PLACEHOLDER/$WIDGET_UUID/g" project.yml
          # 生成 Xcode 项目
          xcodegen generate
          # 验证证书
          security find-identity -v -p codesigning
      - name: Build Archive
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AIGlossaryApp.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            archive 2>&1 | tee build_archive.log | tail -80
      - name: Export IPA
        script: |
          cat > export_options.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store</string>
              <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/AIGlossaryApp.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee export_ipa.log | tail -80
      - name: Upload to App Store Connect
        script: |
          mkdir -p ~/.appstoreconnect/private_keys
          cp AuthKey.p8 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app --file "$IPA_PATH" --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Upload successful!"
    artifacts:
      - build/ios/ipa/*.ipa
      - build_archive.log
      - export_ipa.log
